models:
  - name: locations
    description: Location dimension table with one row per Jaffle Shop location.
    columns:
      - name: location_id
        description: The unique location key.
        data_tests:
          - not_null
          - unique
      - name: location_name
        description: The Jaffle Shop location name.

semantic_models:
  - name: locations
    description: |
      Location dimension table. The grain of the table is one row per location.
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
