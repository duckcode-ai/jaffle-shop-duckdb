<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980" role="img" aria-labelledby="title desc">
  <title id="title">Jaffle Shop 10-second governed analytics flow</title>
  <desc id="desc">A simple flow from Jaffle Shop leadership questions to dbt evidence, DataLex proposals and certification, DQL certified blocks, stakeholder surfaces, and CI.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { fill: #111827; font: 700 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 400 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #64748b; font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .card { stroke-width: 3; rx: 24; }
      .business { fill: #fdf2f8; stroke: #db2777; }
      .dbt { fill: #fff7ed; stroke: #d97706; }
      .datalex { fill: #eef2ff; stroke: #4f46e5; }
      .dql { fill: #ecfdf5; stroke: #059669; }
      .gate { fill: #f8fafc; stroke: #64748b; }
      .num { fill: #111827; font: 800 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cardTitle { fill: #111827; font: 700 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cardText { fill: #334155; font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .noteStrong { fill: #111827; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #334155; font: 500 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1900" height="980"/>
  <text x="80" y="86" class="title">Jaffle Shop Growth Command Center: one story, one trust flow</text>
  <text x="80" y="128" class="subtitle">A user should understand this in 10 seconds: dbt proves the data, DataLex certifies the meaning, DQL serves the answers.</text>

  <text x="96" y="208" class="label">BUSINESS QUESTION</text>
  <text x="374" y="208" class="label">DBT EVIDENCE</text>
  <text x="650" y="208" class="label">AI DRAFT</text>
  <text x="926" y="208" class="label">HUMAN REVIEW</text>
  <text x="1202" y="208" class="label">TRUST HANDOFF</text>
  <text x="1484" y="208" class="label">DQL ANSWERS</text>

  <rect x="76" y="242" width="226" height="182" class="card business"/>
  <circle cx="112" cy="278" r="24" fill="#fbcfe8"/>
  <text x="105" y="287" class="num">1</text>
  <text x="112" y="326" class="cardTitle">Growth questions</text>
  <text x="112" y="364" class="cardText">Revenue movement,</text>
  <text x="112" y="394" class="cardText">customer value, products</text>

  <rect x="352" y="242" width="226" height="182" class="card dbt"/>
  <circle cx="388" cy="278" r="24" fill="#fed7aa"/>
  <text x="381" y="287" class="num">2</text>
  <text x="388" y="326" class="cardTitle">dbt + DuckDB</text>
  <text x="388" y="364" class="cardText">Orders, customers,</text>
  <text x="388" y="394" class="cardText">products, tests</text>

  <rect x="628" y="242" width="226" height="182" class="card datalex"/>
  <circle cx="664" cy="278" r="24" fill="#c7d2fe"/>
  <text x="657" y="287" class="num">3</text>
  <text x="664" y="326" class="cardTitle">AI proposals</text>
  <text x="664" y="364" class="cardText">Revenue, customer,</text>
  <text x="664" y="394" class="cardText">product packs</text>

  <rect x="904" y="242" width="226" height="182" class="card datalex"/>
  <circle cx="940" cy="278" r="24" fill="#c7d2fe"/>
  <text x="933" y="287" class="num">4</text>
  <text x="940" y="326" class="cardTitle">Review + certify</text>
  <text x="940" y="364" class="cardText">Owner, grain, source,</text>
  <text x="940" y="394" class="cardText">assumptions</text>

  <rect x="1180" y="242" width="226" height="182" class="card datalex"/>
  <circle cx="1216" cy="278" r="24" fill="#c7d2fe"/>
  <text x="1209" y="287" class="num">5</text>
  <text x="1216" y="326" class="cardTitle">DataLex manifest</text>
  <text x="1216" y="364" class="cardText">10 certified</text>
  <text x="1216" y="394" class="cardText">definitions</text>

  <rect x="1456" y="242" width="226" height="182" class="card dql"/>
  <circle cx="1492" cy="278" r="24" fill="#bbf7d0"/>
  <text x="1485" y="287" class="num">6</text>
  <text x="1492" y="326" class="cardTitle">DQL blocks</text>
  <text x="1492" y="364" class="cardText">Contract-bound</text>
  <text x="1492" y="394" class="cardText">SQL answers</text>

  <path class="arrow" d="M302 333 L352 333"/>
  <path class="arrow" d="M578 333 L628 333"/>
  <path class="arrow" d="M854 333 L904 333"/>
  <path class="arrow" d="M1130 333 L1180 333"/>
  <path class="arrow" d="M1406 333 L1456 333"/>

  <line x1="1569" y1="424" x2="1569" y2="500" stroke="#64748b" stroke-width="4"/>
  <path class="arrow" d="M1569 500 L460 500 L460 570"/>
  <path class="arrow" d="M1569 500 L840 500 L840 570"/>
  <path class="arrow" d="M1569 500 L1220 500 L1220 570"/>
  <path class="arrow" d="M1569 500 L1569 570"/>

  <rect x="300" y="570" width="320" height="140" class="card dql"/>
  <text x="340" y="624" class="cardTitle">Growth App</text>
  <text x="340" y="664" class="cardText">Executive command center</text>

  <rect x="680" y="570" width="320" height="140" class="card dql"/>
  <text x="720" y="624" class="cardTitle">Notebook research</text>
  <text x="720" y="664" class="cardText">Draft to certified path</text>

  <rect x="1060" y="570" width="320" height="140" class="card dql"/>
  <text x="1100" y="624" class="cardTitle">Governed AI</text>
  <text x="1100" y="664" class="cardText">Certified or review-required</text>

  <rect x="1440" y="570" width="320" height="140" class="card gate"/>
  <text x="1480" y="624" class="cardTitle">CI gate</text>
  <text x="1480" y="664" class="cardText">dbt, DataLex, DQL verify</text>

  <rect x="80" y="788" width="1740" height="72" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="118" y="833" class="noteStrong">10-second takeaway:</text>
  <text x="338" y="833" class="note">The same Jaffle Shop question moves from evidence to certified meaning to reusable stakeholder and AI answers.</text>
</svg>
