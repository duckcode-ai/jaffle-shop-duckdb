kind: contract
id: revenue.Order.monthly_revenue
name: monthly_revenue
display_name: Monthly Revenue
domain: revenue
entity: Order
version: 1
status: certified
owner: revenue-analytics@jaffle.shop
business_definition: Gross order revenue grouped by calendar month.
grain: calendar month
source:
  kind: dbt_model
  ref: model.jaffle_shop.orders
dbt_contract:
  model: orders
  unique_id: model.jaffle_shop.orders
  source_of_truth: true
signature:
  outputs:
    - name: month
      type: date
      description: Calendar month from ordered_at.
    - name: revenue
      type: number
      description: SUM(order_total) for the month.
metrics:
  - name: total_revenue
    formula: SUM(order_total)
    grain: month
    time_dimension: ordered_at
    status: certified
dimensions: [month]
required_tests: [row_count >= 1, revenue >= 0]
evidence:
  source_models: [model.jaffle_shop.orders]
  columns: [ordered_at, order_total]
  semantic_metrics: [total_order_amount]
  tests: [unique_order_id, not_null_order_id]
  inferred_grain: one row per month after aggregation
  assumptions:
    - Calendar month is derived with DuckDB date_trunc('month', ordered_at).
  confidence: 0.93
review:
  cadence: monthly
  reviewers: [revenue-analytics@jaffle.shop]
  last_reviewed_at: "2026-06-22"
tags: [revenue, trend, monthly]
