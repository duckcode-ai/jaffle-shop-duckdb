kind: contract
id: revenue.Order.revenue_by_location
name: revenue_by_location
display_name: Revenue by Location
domain: revenue
entity: Order
version: 1
status: certified
owner: revenue-analytics@jaffle.shop
business_definition: Gross order revenue grouped by Jaffle Shop store location.
grain: location
source:
  kind: dbt_model
  ref: model.jaffle_shop.orders
dbt_contract:
  model: orders
  unique_id: model.jaffle_shop.orders
  source_of_truth: true
signature:
  outputs:
    - name: location_name
      type: string
      description: Store location name from the dbt locations mart.
    - name: revenue
      type: number
      description: SUM(order_total) for the location.
metrics:
  - name: total_revenue
    formula: SUM(order_total)
    grain: location
    status: certified
dimensions: [location_name]
required_tests: [row_count >= 1, revenue >= 0]
evidence:
  source_models: [model.jaffle_shop.orders, model.jaffle_shop.locations]
  columns: [location_id, location_name, order_total]
  inferred_grain: one row per location after aggregation
  assumptions:
    - Location names come from dev.locations joined by location_id.
  confidence: 0.9
review:
  cadence: monthly
  reviewers: [revenue-analytics@jaffle.shop]
  last_reviewed_at: "2026-06-22"
tags: [revenue, location]
