kind: entity
layer: logical
name: customer
logical_name: Customer
description: Customer master record with lifetime value attributes.
owner: growth
domain: commerce
implements: [customer]
candidate_keys:
  - [customer_id]
business_keys:
  - [customer_name]
columns:
  - name: customer_id
    type: identifier
    nullable: false
    primary_key: true
    description: Stable unique identifier for the customer.
  - name: customer_name
    type: string
    nullable: false
    description: Customer's full name.
  - name: customer_type
    type: enum
    nullable: false
    description: Whether the customer is new (one order) or returning (more than one).
    terms: [new_customer, returning_customer]
  - name: count_lifetime_orders
    type: integer
    description: Total number of orders the customer has ever placed.
  - name: first_ordered_at
    type: date
    description: Date the customer placed their first order.
  - name: last_ordered_at
    type: date
    description: Date of the customer's most recent order.
  - name: lifetime_spend
    type: money
    description: Sum of all order totals (including tax) for the customer.
    terms: [customer_lifetime_value]
