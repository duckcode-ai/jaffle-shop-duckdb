kind: entity
layer: physical
dialect: postgres
name: supplies
logical: supply
physical_name: supplies
database: jaffle_shop
schema: dev
description: Physical supplies mart in DuckDB (dev.supplies). One row per supply per SKU.
owner: merchandising
domain: commerce
columns:
  - name: supply_id
    type: varchar
    nullable: false
    logical: supply.supply_id
  - name: product_id
    type: varchar
    nullable: false
    logical: supply.product_id
    references:
      entity: products
      column: product_id
      relationship: many_to_one
  - name: supply_name
    type: varchar
    logical: supply.supply_name
  - name: supply_cost
    type: decimal(16,2)
    logical: supply.supply_cost
  - name: is_perishable
    type: boolean
    logical: supply.is_perishable
