kind: entity
layer: physical
dialect: duckdb
name: products
logical: product
physical_name: products
database: jaffle_shop
schema: dev
description: Physical products mart in DuckDB (dev.products). One row per SKU.
owner: merchandising
domain: commerce
columns:
  - name: product_id
    type: varchar
    nullable: false
    primary_key: true
    logical: product.product_id
  - name: product_name
    type: varchar
    nullable: false
    logical: product.product_name
  - name: product_type
    type: varchar
    logical: product.product_type
  - name: product_price
    type: decimal(16,2)
    logical: product.product_price
  - name: is_food_item
    type: boolean
    logical: product.is_food_item
  - name: is_drink_item
    type: boolean
    logical: product.is_drink_item
