kind: entity
layer: physical
dialect: duckdb
name: orders
logical: order
physical_name: orders
database: jaffle_shop
schema: dev
description: Physical orders mart in DuckDB (dev.orders). One row per order.
owner: growth
domain: commerce
columns:
  - name: order_id
    type: varchar
    nullable: false
    primary_key: true
    logical: order.order_id
  - name: customer_id
    type: varchar
    nullable: false
    logical: order.customer_id
    references:
      entity: customers
      column: customer_id
      relationship: many_to_one
  - name: ordered_at
    type: date
    nullable: false
    logical: order.ordered_at
  - name: order_total
    type: decimal(16,2)
    nullable: false
    logical: order.order_total
  - name: order_cost
    type: decimal(38,2)
    logical: order.order_cost
  - name: is_food_order
    type: boolean
    logical: order.is_food_order
  - name: is_drink_order
    type: boolean
    logical: order.is_drink_order
indexes:
  - name: orders_customer_id_idx
    columns: [customer_id]
