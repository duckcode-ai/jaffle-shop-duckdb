# One-command demo: `docker compose up --build`
#
# Builds the image (dbt + DataLex + DQL) and serves the DQL notebook and
# Growth Command Center App at http://127.0.0.1:3474.
services:
  jaffle:
    build: .
    image: jaffle-shop-duckdb
    ports:
      - "3474:3474" # DQL notebook + Growth Command Center App
    # To serve dbt docs + lineage instead, override the command:
    #   docker compose run --rm --service-ports jaffle \
    #     bash -c "cd /app && source .venv/bin/activate && \
    #              dbt docs serve --profiles-dir . --host 0.0.0.0 --port 8080"
