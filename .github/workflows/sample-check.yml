# Runs the README's steps 1 and 2 (without `npm run notebook`) and checks
# that the workspace validates and every block example routes to its block.
name: Sample check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sample-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Sample check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build the dbt project
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/dbt deps --profiles-dir .
          .venv/bin/dbt seed --profiles-dir .
          .venv/bin/dbt build --profiles-dir . --exclude resource_type:seed

      - name: Install ZLens
        run: |
          npm install
          npm install --prefix .dql/connectors duckdb

      - name: Open the database with ZLens's DuckDB driver
        # Fails if dbt wrote jaffle_shop.duckdb with a DuckDB that ZLens
        # cannot read (for example Python duckdb 2.0).
        run: |
          node -e "
            const { Database } = require('./.dql/connectors/node_modules/duckdb');
            new Database('jaffle_shop.duckdb', { access_mode: 'READ_ONLY' }, (err) => {
              if (err) { console.error(err.message); process.exit(1); }
              console.log('jaffle_shop.duckdb opens with the ZLens DuckDB driver');
            });
          "

      - name: Sync
        run: npm run sync

      - name: Validate
        run: npm run validate

      # Every certified block's examples[].question must route to that block.
      - name: Eval
        run: npx zlens eval . --min-route-accuracy 1 --min-refusal 1
