name: Demo image

# Publishes ghcr.io/duckcode-ai/zlens-demo (amd64 + arm64): the sample, built,
# with ZLens ready to start. Used by `docker run` in the README and by the
# GitHub Codespaces dev container. The weekly run picks up new ZLens releases.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image installs this ZLens version. Passing it as a build argument
      # rebuilds the setup layer when a new ZLens is published; otherwise the
      # build cache would keep the version from the last build.
      - id: zlens
        run: echo "version=$(npm view @zlens/cli version)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ZLENS_VERSION=${{ steps.zlens.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/duckcode-ai/zlens-demo:latest
            ghcr.io/duckcode-ai/zlens-demo:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ZLens demo (Jaffle Shop)
            org.opencontainers.image.description=The Jaffle Shop dbt sample with ZLens, ready to open
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
